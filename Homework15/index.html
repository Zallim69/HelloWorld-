<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  
  <body>
    <div class="container">
      <ul class="comments">
        <li class="comment">
          <div class="comment-header">
            <div>Глеб Фокин</div>
            <div>12.02.22 12:18</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Это будет первый комментарий на этой странице
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">3</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
        <li class="comment">
          <div class="comment-header">
            <div>Варвара Н.</div>
            <div>13.02.22 19:22</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Мне нравится как оформлена эта страница! ❤
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">75</span>
              <button class="like-button -active-like"></button>
            </div>
          </div>
        </li>
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите Ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите Ваш комментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  
    <script>
   "use strict";

const commentsData = [
  {
    name: "Глеб Фокин",
    date: "12.02.22 12:18",
    text: "Это будет первый комментарий на этой странице",
    likes: 3,
    liked: false,
  },
  {
    name: "Варвара Н.",
    date: "13.02.22 19:22",
    text: "Мне нравится как оформлена эта страница! ❤",
    likes: 75,
    liked: true,
  },
];

function renderComments() {
  const commentsList = document.querySelector(".comments");
  commentsList.innerHTML = "";

  commentsData.forEach((comment) => {
    const newComment = document.createElement("li");
    newComment.classList.add("comment");

    // Экранируем все данные перед вставкой в HTML
    newComment.innerHTML = `
      <div class="comment-header">
        <div>${sanitizeHTML(comment.name)}</div>
        <div>${sanitizeHTML(comment.date)}</div>
      </div>
      <div class="comment-body">
        <div class="comment-text"></div>
      </div>
      <div class="comment-footer">
        <div class="likes">
          <span class="likes-counter">${comment.likes}</span>
          <button class="like-button ${
            comment.liked ? "-active-like" : ""
          }"></button>
        </div>
      </div>
    `;

    // Обработка текста комментария
    const commentText = newComment.querySelector(".comment-text");
    commentText.innerHTML = sanitizeHTML(comment.text);
    
    // Обработчик для ответа на комментарий
    commentText.addEventListener("click", () => {
      showComment(comment.text);
    });

    // Обработчик лайка с остановкой всплытия
    const likeButton = newComment.querySelector(".like-button");
    likeButton.addEventListener("click", (event) => {
      event.stopPropagation();
      comment.liked = !comment.liked;
      comment.likes += comment.liked ? 1 : -1;
      renderComments();
    });

    commentsList.appendChild(newComment);
  });
}

function showComment(commentText) {
  const textInput = document.querySelector(".add-form-text");
  const formattedText = commentText.trim().startsWith(">")
    ? commentText.trim()
    : `> ${commentText.trim()}`;
  textInput.value = formattedText;
}

// Функция экранирования HTML
function sanitizeHTML(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;")
    .replace(/\//g, "&#x2F;");
}

// Инициализация формы
const addButton = document.querySelector(".add-form-button");
const nameInput = document.querySelector(".add-form-name");
const textInput = document.querySelector(".add-form-text");

addButton.addEventListener("click", () => {
  // Получаем и очищаем данные без экранирования
  const name = nameInput.value.trim();
  const text = textInput.value.trim();

  if (name && text) {
    commentsData.push({
      name: name,
      date: new Date().toLocaleString(),
      text: text,
      likes: 0,
      liked: false,
    });
    renderComments();
    nameInput.value = "";
    textInput.value = "";
  } else {
    alert("Заполните оба поля!");
  }
});

// Первоначальная отрисовка
renderComments();
    </script>
  </body>
</html>
